services:
  - type: web
    name: giu-signalements
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: giu-signalements.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://giu-signalements.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: giu-database
          property: connectionString
      - key: SERVE_MEDIA
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Envoi des notifications par e-mail via l'API Brevo (à renseigner dans le tableau de bord Render).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: giu-database
    databaseName: giu
    user: giu
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
