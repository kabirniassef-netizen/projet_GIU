services:
  - type: web
    name: giu-signalements
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py ensure_admin && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeploy: false
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: giu-signalements.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://giu-signalements.onrender.com
      # Base PostgreSQL chez Neon (gratuite sans expiration, contrairement à celle de Render) :
      # chaîne de connexion « pooled » du projet Neon, à renseigner dans le tableau de bord Render.
      - key: DATABASE_URL
        sync: false
      - key: SERVE_MEDIA
        value: "True"
      # Stockage des photos chez Neon Object Storage (le disque de Render gratuit est effacé à chaque redémarrage).
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_REGION
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Envoi des notifications par e-mail via l'API Brevo (à renseigner dans le tableau de bord Render).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Chatbot Typebot (voir docs/chatbot-typebot.md).
      - key: TYPEBOT_ID
        sync: false
      - key: TYPEBOT_API_HOST
        sync: false
      - key: CHATBOT_API_KEY
        sync: false

