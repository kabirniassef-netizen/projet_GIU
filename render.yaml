services:
  - type: web
    name: giu-signalements
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: false
    disk:
      name: giu-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: giu-signalements.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://giu-signalements.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: giu-database
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

databases:
  - name: giu-database
    databaseName: giu
    user: giu
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
