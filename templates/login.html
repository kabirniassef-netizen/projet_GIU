<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GIU Système de Gestion d'Infrastructure Urbaine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0066cc;
            --primary-dark: #004a99;
            --primary-light: #3399ff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --light-bg: #f5f5f5;
            --border-color: #ddd;
            --text-dark: #333;
            --text-muted: #666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .login-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-check input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .form-check label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .forgot-password {
            text-align: right;
            font-size: 12px;
        }

        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: var(--primary-dark);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-login:hover {
            background: var(--primary-dark);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-footer {
            background-color: var(--light-bg);
            padding: 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: var(--primary-dark);
        }

        .demo-credentials {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #004085;
        }

        .demo-credentials h4 {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #002752;
        }

        .demo-credentials p {
            margin: 5px 0;
            font-family: monospace;
        }

        .demo-credentials code {
            background-color: white;
            padding: 2px 4px;
            border-radius: 2px;
            color: var(--primary-color);
        }

        .text-center {
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 10px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 22px;
            }

            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🏛️</div>
                <h1>GIU</h1>
                <p>Système de Gestion d'Infrastructure Urbaine</p>
            </div>

            <div class="login-body">
                <div id="alert" class="alert"></div>

                <div class="demo-credentials">
                    <h4>📋 Comptes de Démonstration:</h4>
                    <p><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></p>
                    <p><strong>Citoyen:</strong> <code>citoyen1</code> / <code>password123</code></p>
                    <p><strong>Agent:</strong> <code>agent1</code> / <code>password123</code></p>
                    <p><strong>Manager:</strong> <code>manager1</code> / <code>password123</code></p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Nom d'utilisateur ou Email</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="admin" 
                            required 
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Se souvenir de moi</label>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="loading-spinner" id="spinner"></span>
                        <span id="btnText">Se Connecter</span>
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <p>Pas encore de compte? <a href="#signup">Contactez l'administrateur</a></p>
                <p style="margin-top: 10px; font-size: 11px; color: #999;">
                    Version 1.0.0 © 2026 Municipalité
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        // API Client pour la connexion
        const API_BASE_URL = '/api';

        class AuthClient {
            constructor() {
                this.token = localStorage.getItem('auth_token');
                this.user = JSON.parse(localStorage.getItem('user_data') || '{}');
            }

            async login(username, password) {
                try {
                    const response = await fetch(`${API_BASE_URL}/auth/login/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Erreur de connexion');
                    }

                    const data = await response.json();
                    this.setToken(data.token);
                    this.setUser(data.user || { username });
                    return data;
                } catch (error) {
                    throw error;
                }
            }

            setToken(token) {
                this.token = token;
                localStorage.setItem('auth_token', token);
            }

            setUser(user) {
                this.user = user;
                localStorage.setItem('user_data', JSON.stringify(user));
            }

            logout() {
                this.token = null;
                this.user = {};
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
            }

            isAuthenticated() {
                return !!this.token;
            }
        }

        // Initialisation
        const authClient = new AuthClient();
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const alertDiv = document.getElementById('alert');

        // Afficher une alerte
        function showAlert(message, type = 'error') {
            alertDiv.textContent = message;
            alertDiv.className = `alert show alert-${type}`;
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // Charger les identifiants sauvegardés
        function loadRememberedUsername() {
            const remembered = localStorage.getItem('remembered_username');
            if (remembered) {
                usernameInput.value = remembered;
                rememberCheckbox.checked = true;
            }
        }

        // Gestion de la soumission du formulaire
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }

            // Désactiver le bouton et afficher le spinner
            loginBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Connexion en cours...';

            try {
                const result = await authClient.login(username, password);

                // Sauvegarder le nom d'utilisateur si "Se souvenir" est coché
                if (rememberCheckbox.checked) {
                    localStorage.setItem('remembered_username', username);
                } else {
                    localStorage.removeItem('remembered_username');
                }

                showAlert('Connexion réussie! Redirection...', 'success');

                // Rediriger après 1.5 secondes
                setTimeout(() => {
                    window.location.href = '/dashboard/';
                }, 1500);
            } catch (error) {
                showAlert(error.message || 'Erreur de connexion', 'error');
                loginBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Se Connecter';
                passwordInput.value = '';
            }
        });

        // Si déjà connecté, rediriger vers l'accueil
        window.addEventListener('DOMContentLoaded', () => {
            if (authClient.isAuthenticated()) {
                window.location.href = '/dashboard/';
            }
            loadRememberedUsername();
        });

        // Permettre la soumission du formulaire avec Entrée
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
