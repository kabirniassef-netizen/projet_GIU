{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Suivez l’avancement de votre signalement avec son code GIU.">
  <meta name="theme-color" content="#2563eb">
  <title>Suivre un signalement — GIU</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/public.css' %}">
</head>
<body class="public-body">
  <nav class="public-nav">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="public-brand" href="/"><span><i class="fa-solid fa-city" aria-hidden="true"></i></span><span>GIU — Suivi citoyen</span></a>
      <a class="btn btn-sm btn-primary" href="/signaler/"><i class="fa-solid fa-plus me-1" aria-hidden="true"></i>Signaler</a>
    </div>
  </nav>
  <main class="container pb-5">
    <div class="mx-auto" style="max-width: 640px">
      <h1 class="h2 fw-bold mb-2">Suivre un signalement</h1>
      <p class="text-secondary">Saisissez le code reçu lors de votre signalement (ex. <code>GIU-AB12CD34</code>).</p>
      <div class="public-card">
        <form id="trackForm" class="d-flex flex-column flex-sm-row gap-2" novalidate>
          <label class="visually-hidden" for="trackingCodeInput">Code de suivi</label>
          <input class="form-control form-control-lg text-uppercase" id="trackingCodeInput" name="code" placeholder="GIU-XXXXXXXX" required maxlength="12" autocomplete="off" spellcheck="false">
          <button class="btn btn-primary btn-lg flex-shrink-0" type="submit"><i class="fa-solid fa-magnifying-glass me-2" aria-hidden="true"></i>Rechercher</button>
        </form>
        <div id="recentCodes" class="small mt-3" hidden></div>
        <div id="trackResult" class="mt-4" aria-live="polite"></div>
      </div>
      <p class="text-center mt-3 mb-0 small"><a href="/">Retour à l’accueil</a></p>
    </div>
  </main>
  <script>
    (() => {
      const STEPS = [['created', 'Reçu'], ['validated', 'Validé'], ['planned', 'Planifié'], ['in_progress', 'En cours'], ['resolved', 'Résolu']];
      const form = document.getElementById('trackForm');
      const input = document.getElementById('trackingCodeInput');
      const result = document.getElementById('trackResult');
      const dateFormat = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const el = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };

      function stepper(status) {
        const list = el('ol', status === 'rejected' ? 'stepper rejected' : 'stepper');
        if (status === 'rejected') {
          list.append(el('li', 'done', 'Reçu'), el('li', 'current', 'Clôturé sans suite'));
          return list;
        }
        const index = STEPS.findIndex(([key]) => key === status);
        STEPS.forEach(([, label], position) => list.appendChild(el('li', position < index || status === 'resolved' ? 'done' : position === index ? 'current' : '', label)));
        return list;
      }

      async function lookup(code) {
        result.replaceChildren(el('p', 'text-secondary mb-0', 'Recherche…'));
        try {
          const response = await fetch(`/api/incidents/track/${encodeURIComponent(code)}/`);
          if (response.status === 404) throw new Error('Aucun signalement ne correspond à ce code. Vérifiez sa saisie.');
          if (response.status === 429) throw new Error('Trop de recherches. Réessayez dans un moment.');
          if (!response.ok) throw new Error('Le service est momentanément indisponible.');
          const incident = await response.json();
          const header = el('div', 'd-flex flex-wrap justify-content-between align-items-start gap-2');
          const title = el('div');
          title.append(el('h2', 'h5 fw-bold mb-1', incident.title), el('p', 'text-secondary small mb-0', `${incident.category_display}${incident.commune ? ' · ' + incident.commune : ''} · signalé le ${dateFormat.format(new Date(incident.created_at))}`));
          header.append(title, el('span', 'badge text-bg-primary fs-6', incident.status_display));
          const history = el('ol', 'timeline mt-4');
          incident.timeline.forEach(step => {
            const item = el('li');
            item.append(el('strong', '', step.status_display), el('br'), el('small', '', dateFormat.format(new Date(step.date))));
            history.appendChild(item);
          });
          result.replaceChildren(header, stepper(incident.status), el('h3', 'h6 fw-semibold mt-4 mb-2', 'Historique'), history);
          const url = new URL(window.location.href);
          url.searchParams.set('code', incident.tracking_code);
          window.history.replaceState({}, '', url);
        } catch (error) {
          result.replaceChildren(el('div', 'alert alert-warning mb-0', error instanceof TypeError ? 'Impossible de joindre le serveur.' : error.message));
        }
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const code = input.value.trim().toUpperCase();
        if (!/^GIU-[A-Z0-9]{8}$/.test(code)) {
          result.replaceChildren(el('div', 'alert alert-warning mb-0', 'Le code a la forme GIU- suivi de 8 caractères.'));
          return;
        }
        lookup(code);
      });

      try {
        const codes = JSON.parse(localStorage.getItem('giu_tracking_codes') || '[]');
        if (codes.length) {
          const box = document.getElementById('recentCodes');
          box.append(el('span', 'text-secondary me-2', 'Vos codes récents :'));
          codes.forEach(code => {
            const button = el('button', 'btn btn-sm btn-light me-1 mb-1', code);
            button.type = 'button';
            button.addEventListener('click', () => { input.value = code; lookup(code); });
            box.appendChild(button);
          });
          box.hidden = false;
        }
      } catch (error) { /* historique local indisponible */ }

      const initial = new URLSearchParams(window.location.search).get('code');
      if (initial) { input.value = initial.toUpperCase(); lookup(initial.toUpperCase()); }
    })();
  </script>
  {% include 'partials/typebot_bubble.html' %}
</body>
</html>
